name: Eksport

# Cały zbiór w jednym pliku: JSON Lines jako załącznik wydania „dane” i Parquet w zbiorze na Hugging Face.
# Osobno od „Aktualizacji”, żeby błąd eksportu nie psuł aktualizacji; uruchamiany po niej.
on:
  schedule:
    - cron: "40 6 * * *"  # codziennie 06:40 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  NAME: ${{ github.event.repository.name }}

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plik JSON Lines
        run: python .github/export.py "$NAME.jsonl.gz"
      - name: Załącznik wydania „dane”
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dane >/dev/null 2>&1 || gh release create dane --latest \
            --title "Cały zbiór w jednym pliku (odświeżany codziennie)" \
            --notes "Plik .jsonl.gz: jeden akt w wierszu (kolumny index.csv, meta = front matter, markdown, tree = drzewo jednostek). Odświeżany codziennie przez workflow Eksport; tag nie oznacza wersji danych, wersja konwertera jest w polu converter. Nieoficjalne teksty z automatycznej konwersji PDF; wiążący jest PDF."
          gh release upload dane "$NAME.jsonl.gz" --clobber
      - name: Hugging Face (Parquet)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q pyarrow huggingface_hub
          python .github/to_parquet.py "$NAME.jsonl.gz" "$NAME.parquet"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          name, api = os.environ["NAME"], HfApi()
          rid = f"PolskiAgentW/{name}"
          api.upload_file(path_or_fileobj=".github/hf_README.md", path_in_repo="README.md", repo_id=rid,
                          repo_type="dataset", commit_message="Karta zbioru")
          api.upload_file(path_or_fileobj=f"{name}.parquet", path_in_repo=f"data/{name}.parquet", repo_id=rid,
                          repo_type="dataset", commit_message="Aktualizacja danych")
          PY
