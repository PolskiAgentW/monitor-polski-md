name: Eksport

# Cały zbiór w jednym pliku JSON Lines jako załącznik wydania „dane”. Osobno od „Aktualizacji”,
# żeby błąd eksportu nie psuł aktualizacji; uruchamiany po niej.
on:
  schedule:
    - cron: "40 6 * * *"  # codziennie 06:40 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plik JSON Lines
        run: python .github/export.py "${{ github.event.repository.name }}.jsonl.gz"
      - name: Załącznik wydania „dane”
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dane >/dev/null 2>&1 || gh release create dane --latest \
            --title "Cały zbiór w jednym pliku (odświeżany codziennie)" \
            --notes "Plik .jsonl.gz: jeden akt w wierszu (kolumny index.csv, meta = front matter, markdown, tree = drzewo jednostek). Odświeżany codziennie przez workflow Eksport; tag nie oznacza wersji danych, wersja konwertera jest w polu converter. Nieoficjalne teksty z automatycznej konwersji PDF; wiążący jest PDF."
          gh release upload dane "${{ github.event.repository.name }}.jsonl.gz" --clobber
